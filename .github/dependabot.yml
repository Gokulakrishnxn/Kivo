version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "weekly", day: "monday", time: "06:00" }
    open-pull-requests-limit: 5
    commit-message: { prefix: "ci", include: "scope" }
    labels: ["dependencies", "ci"]

  # npm and cargo ecosystems are deliberately absent until the application
  # scaffold lands at Milestone 2. Dependabot errors on a manifest that does
  # not exist, so they are added with src/ and src-tauri/, not before.
