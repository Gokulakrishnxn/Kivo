name-template: "Kivo v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
categories:
  - title: "✨ Features"
    labels: ["feature", "enhancement"]
  - title: "🐛 Fixes"
    labels: ["fix", "bug"]
  - title: "🎙 Speech & accuracy"
    labels: ["asr", "accuracy"]
  - title: "🎨 Design & brand"
    labels: ["design", "brand", "website"]
  - title: "📚 Documentation"
    labels: ["documentation"]
  - title: "🔒 Security"
    labels: ["security"]
  - title: "🧰 Maintenance"
    labels: ["chore", "ci", "dependencies", "refactor"]
change-template: "- $TITLE (#$NUMBER) @$AUTHOR"
change-title-escapes: '\<*_&'
version-resolver:
  major: { labels: ["breaking"] }
  minor: { labels: ["feature", "enhancement"] }
  patch: { labels: ["fix", "bug", "chore", "dependencies", "documentation"] }
  default: patch
exclude-labels: ["skip-changelog"]
template: |
  ## What's new

  $CHANGES

  ---
  **Full changelog:** https://github.com/Gokulakrishnxn/Kivo/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION

  Kivo is free and open source software. Copyright (c) 2026 Gokulakrishnan, MIT licensed.
