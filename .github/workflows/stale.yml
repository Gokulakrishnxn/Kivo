name: Stale issues and pull requests

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@v9
        with:
          days-before-issue-stale: 60
          days-before-issue-close: 14
          days-before-pr-stale: 30
          days-before-pr-close: 14
          stale-issue-label: "stale"
          stale-pr-label: "stale"
          exempt-issue-labels: "pinned,security,roadmap,good first issue,help wanted"
          exempt-pr-labels: "pinned,security,work in progress"
          stale-issue-message: >
            This issue has had no activity for 60 days, so Kivo's bot is marking it stale.
            If it is still relevant, leave a comment and it will stay open — a single
            "still relevant" is enough. Otherwise it will close in 14 days.
            Closed issues can always be reopened.
          stale-pr-message: >
            This pull request has had no activity for 30 days, so Kivo's bot is marking it
            stale. Push a commit or leave a comment to keep it open. It will close in 14 days,
            and reopening is always fine.
          close-issue-message: >
            Closing after 14 further days of inactivity. This is bookkeeping, not a judgement
            on the idea — comment here any time and it will be reopened.
          close-pr-message: >
            Closing after 14 further days of inactivity. Thank you for the work you put in;
            comment here any time to pick it back up.
          operations-per-run: 100
          ascending: true
