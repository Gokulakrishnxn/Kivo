name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-health:
    name: Repository health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Required files are present
        run: |
          missing=0
          for f in README.md LICENSE NOTICE PRD.md CONTRIBUTING.md \
                   CODE_OF_CONDUCT.md SECURITY.md CLAUDE.md \
                   brand/BRAND.md brand/tokens/kivo-tokens.css \
                   brand/tokens/kivo-tokens.json web/index.html; do
            if [ ! -f "$f" ]; then echo "::error file=$f::required file is missing"; missing=1; fi
          done
          exit $missing

      - name: SVG assets are well-formed
        run: |
          python3 - <<'PY'
          import glob, sys, xml.dom.minidom
          bad = []
          files = glob.glob('**/*.svg', recursive=True)
          for f in files:
              try:
                  xml.dom.minidom.parse(f)
              except Exception as e:
                  bad.append(f'{f}: {e}')
          print(f'checked {len(files)} svg file(s)')
          if bad:
              for b in bad:
                  print(f'::error::{b}')
              sys.exit(1)
          PY

      - name: JSON is valid
        run: |
          python3 - <<'PY'
          import glob, json, sys
          bad = []
          files = [f for f in glob.glob('**/*.json', recursive=True) if 'node_modules' not in f]
          for f in files:
              try:
                  json.load(open(f))
              except Exception as e:
                  bad.append(f'{f}: {e}')
          print(f'checked {len(files)} json file(s)')
          if bad:
              for b in bad:
                  print(f'::error::{b}')
              sys.exit(1)
          PY

      - name: Design tokens and stylesheet agree
        run: |
          python3 - <<'PY'
          import json, re, sys
          css = open('brand/tokens/kivo-tokens.css').read()
          tok = json.load(open('brand/tokens/kivo-tokens.json'))
          declared = set(re.findall(r'--kivo-[a-z0-9-]+', css))
          missing = []
          for group in ('surface', 'text', 'accent'):
              for name, entry in tok[group].items():
                  hexv = entry['$value']
                  if hexv.upper() not in css.upper():
                      missing.append(f'{group}.{name} ({hexv})')
          if missing:
              for m in missing:
                  print(f'::error::token {m} is in the JSON but its value never appears in the CSS')
              sys.exit(1)
          n = sum(len(tok[g]) for g in ('surface', 'text', 'accent'))
          print(f'{n} colour tokens present in both sources; {len(declared)} custom properties declared')
          PY

      - name: Website token copy matches the canonical source
        run: |
          if ! diff -q brand/tokens/kivo-tokens.css web/assets/kivo-tokens.css > /dev/null; then
            echo "::error::web/assets/kivo-tokens.css has drifted from brand/tokens/kivo-tokens.css"
            diff brand/tokens/kivo-tokens.css web/assets/kivo-tokens.css || true
            exit 1
          fi
          if ! diff -rq brand/illustration web/assets/illustration > /dev/null; then
            echo "::error::web/assets/illustration has drifted from brand/illustration"
            diff -rq brand/illustration web/assets/illustration || true
            exit 1
          fi
          echo "website copies are identical to the canonical sources"

      - name: Relative links in Markdown resolve
        run: |
          python3 - <<'PY'
          import glob, os, re, sys
          pat = re.compile(r'\[[^\]]*\]\(([^)\s#]+)')
          bad = []
          for md in glob.glob('**/*.md', recursive=True):
              if 'node_modules' in md:
                  continue
              base = os.path.dirname(md)
              for link in pat.findall(open(md, encoding='utf-8').read()):
                  if re.match(r'^(https?:|mailto:|#|/)', link):
                      continue
                  target = os.path.normpath(os.path.join(base, link))
                  if not os.path.exists(target):
                      bad.append(f'{md} -> {link}')
          if bad:
              for b in bad:
                  print(f'::error::broken relative link: {b}')
              sys.exit(1)
          print('all relative Markdown links resolve')
          PY

  website:
    name: Website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: HTML sanity check
        run: |
          python3 - <<'PY'
          import glob, re, sys
          bad = []
          for f in glob.glob('web/**/*.html', recursive=True):
              s = open(f, encoding='utf-8').read()
              if '<title>' not in s:
                  bad.append(f'{f}: missing <title>')
              if 'lang=' not in s:
                  bad.append(f'{f}: <html> missing lang attribute')
              if re.search(r'<img(?![^>]*\salt=)', s):
                  bad.append(f'{f}: an <img> is missing alt text')
              for href in re.findall(r'(?:href|src)="(?!https?:|mailto:|#|data:)([^"]+)"', s):
                  import os
                  t = os.path.normpath(os.path.join('web', href.lstrip('/')))
                  if not os.path.exists(t):
                      bad.append(f'{f}: dead asset reference {href}')
          if bad:
              for b in bad:
                  print(f'::error::{b}')
              sys.exit(1)
          print('html sanity checks passed')
          PY

  app:
    name: App (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Detect application source
        id: detect
        run: |
          if [ -f package.json ] && [ -d src-tauri ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Application scaffold not present yet - skipping."
          fi

      - uses: dtolnay/rust-toolchain@stable
        if: steps.detect.outputs.present == 'true'
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        if: steps.detect.outputs.present == 'true'
        with:
          workspaces: src-tauri
          # Cache the registry but NOT target/. sherpa-rs-sys emits
          # libonnxruntime into the profile directory from its build script;
          # a restored target/ marks that script fresh so it never reruns,
          # while the cache's pruning has already dropped the dylib — and the
          # link then fails with "library 'onnxruntime.1.17.1' not found".
          cache-targets: false

      # The prebuilt native libraries, which is the slow part worth keeping.
      - name: Cache sherpa-onnx prebuilts
        if: steps.detect.outputs.present == 'true'
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/sherpa-rs
          key: sherpa-rs-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: sherpa-rs-${{ runner.os }}-

      - uses: pnpm/action-setup@v6
        if: steps.detect.outputs.present == 'true'
        with:
          version: 9

      - uses: actions/setup-node@v4
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: 20
          cache: pnpm

      - name: Install frontend dependencies
        if: steps.detect.outputs.present == 'true'
        run: pnpm install --frozen-lockfile

      - name: Typecheck the interface
        if: steps.detect.outputs.present == 'true'
        run: pnpm typecheck

      - name: Formatting
        if: steps.detect.outputs.present == 'true'
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Lints
        if: steps.detect.outputs.present == 'true'
        working-directory: src-tauri
        run: cargo clippy --lib --all-features -- -D warnings

      - name: Tests
        if: steps.detect.outputs.present == 'true'
        working-directory: src-tauri
        run: cargo test --lib
