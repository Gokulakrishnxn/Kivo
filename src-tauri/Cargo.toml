[package]
name = "kivo"
version = "0.1.0"
description = "Turns voice into clean text."
authors = ["Gokulakrishnan"]
license = "MIT"
repository = "https://github.com/Gokulakrishnxn/Kivo"
edition = "2021"
rust-version = "1.85"

[lib]
name = "kivo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1.0.104"
arboard = "3.6.1"
core-foundation = "0.10.1"
cpal = "0.18.2"
crossbeam-channel = "0.5.16"
dirs = "6.0.0"
enigo = "0.6.1"
hound = "3.5.1"
parking_lot = "0.12.5"
rdev = "0.5.3"
rubato = "4.0.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
sherpa-rs = "0.6.8"
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
thiserror = "2.0.20"
toml = "1.0.7"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
