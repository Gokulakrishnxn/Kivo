<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kivo</title>
    <!--
      Painted before anything else loads, so the window is never a blank void
      while the CSS bundle parses or if the page fails to boot at all. These
      are the same two --kivo-canvas values as kivo-tokens.css (light/dark);
      it cannot import that file (no bundler has run yet), so the values are
      repeated here deliberately. Only html/body are painted — #root is left
      alone so it always shows body's colour through it rather than carrying
      a second, separately-maintained background that the real stylesheet's
      dark-mode query has no way to reach and override.
    -->
    <style>
      html, body { background: #FBFAF9; height: 100%; margin: 0; }
      @media (prefers-color-scheme: dark) {
        html, body { background: #121212; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
