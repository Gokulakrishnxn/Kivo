<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kivo</title>
    <!--
      Painted before anything else loads, so the window is never a blank void
      while the CSS bundle parses or if the page fails to boot at all. This is
      the same cream canvas as --kivo-canvas in kivo-tokens.css; it cannot
      import that file (no bundler has run yet), so the value is repeated here
      deliberately.
    -->
    <style>
      html, body, #root { background: #FBFAF9; height: 100%; margin: 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
